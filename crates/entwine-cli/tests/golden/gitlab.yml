# entwine-managed: generated by `entwine setup`. Safe to edit.
# Delete this file and re-run `entwine setup` to regenerate it.
.entwine-base:
  image: $ENTWINE_IMAGE
  variables:
    ENTWINE_IMAGE: "node:22"
    ENTWINE_VERSION: "{{VERSION}}"

# Merge requests: validate only.
entwine:check:
  extends: .entwine-base
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docs/**/*
        - .gitlab/ci/entwine.yml
  script:
    - npm install --global "@entwine/cli@${ENTWINE_VERSION}"
    - entwine check

# Default branch: validate and build once; the Pages job publishes this exact artifact.
entwine:build:
  extends: .entwine-base
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docs/**/*
        - .gitlab/ci/entwine.yml
  script:
    - npm install --global "@entwine/cli@${ENTWINE_VERSION}"
    - entwine check
    - entwine build
  artifacts:
    paths:
      - dist
    expire_in: 1 day

# `pages.publish` requires GitLab 17.10 or later (GitLab.com and Self-Managed).
entwine:pages:
  extends: .entwine-base
  stage: deploy
  needs:
    - entwine:build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docs/**/*
        - .gitlab/ci/entwine.yml
  script:
    - echo "Publishing the Entwine build validated in entwine:build"
  pages:
    publish: dist
