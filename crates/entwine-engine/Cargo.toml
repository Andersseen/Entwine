[package]
name = "entwine-engine"
description = "Markdown knowledge compiler and static projections"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[dependencies]
entwine-core = { path = "../entwine-core" }
serde.workspace = true
serde_json.workspace = true
flowview-compiler = { workspace = true, optional = true }
pulldown-cmark = "0.13"
serde_yaml = { package = "yaml_serde", version = "0.10" }
walkdir = "2"
percent-encoding = "2"
toml = "1.1"

[features]
default = []
flowview-renderer = ["dep:flowview-compiler"]

[dev-dependencies]
tempfile = "3"
[lints]
workspace = true

[[example]]
name = "renderer_parity"
required-features = ["flowview-renderer"]

[[example]]
name = "renderer_benchmark"
required-features = ["flowview-renderer"]
