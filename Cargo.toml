[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flowview-compiler = { git = "https://github.com/Andersseen/flowview", rev = "35f8c3f211b1f70099462860d80dec944a27d501" }

[workspace.lints.rust]
unsafe_code = "forbid"

