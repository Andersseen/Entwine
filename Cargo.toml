[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flowview-compiler = { git = "https://github.com/Andersseen/flowview", rev = "fba1468fe12bebc3e2f298d4550b9b01f991dbd9" }

[workspace.lints.rust]
unsafe_code = "forbid"

