[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flowview-compiler = { git = "https://github.com/Andersseen/flowview", rev = "77a94d58b44f07bf70c8320ef84341481446cceb" }

[workspace.lints.rust]
unsafe_code = "forbid"

