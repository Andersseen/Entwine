name: Release

# Versioning is automated by release-please from Conventional Commits:
#   1. Commits land on main (squash-merged PRs, titled `feat: ...`, `fix: ...`).
#   2. release-please keeps a "release PR" open that bumps every version file and
#      writes CHANGELOG.md.
#   3. Merging that PR creates a *draft* GitHub release. This workflow then runs
#      the full CI, builds native binaries, uploads them, publishes the npm
#      packages with provenance, and only then un-drafts the release.
#
# Invariant: a draft release has no Git tag, so release-please would count every
# already-shipped commit as unreleased. While any release is still a draft the
# `guard` job therefore skips release-please entirely (cleanly, not red). A failed
# draft is resumed with "Run workflow" and the tag; it reuses published packages
# and attached assets.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to resume (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Drafts are only visible to tokens with write access to contents.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.guard.outputs.pending || 'none' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
      - uses: actions/setup-node@v7
        if: github.event_name == 'push'
        with:
          node-version: 22
      - id: guard
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft > "$RUNNER_TEMP/releases.json"
          node tooling/release-state.ts guard --releases "$RUNNER_TEMP/releases.json"

  release-please:
    needs: guard
    if: needs.guard.outputs.pending == 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # Explicit CI dispatch after GITHUB_TOKEN branch updates.
    outputs:
      needs_build: ${{ steps.plan.outputs.needs_build || 'true' }}
      created: ${{ steps.resume.outputs.created || steps.rp.outputs.release_created }}
      tag: ${{ steps.resume.outputs.tag || steps.rp.outputs.tag_name }}
      version: ${{ steps.resume.outputs.version || steps.rp.outputs.version }}
      sha: ${{ steps.resume.outputs.sha || steps.rp.outputs.sha }}
      prs: ${{ steps.rp.outputs.prs }}
    steps:
      - id: rp
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # A draft release has no Git tag yet: the tag is created when the release is
      # published. Resume therefore resolves the commit the draft targets, and refuses
      # to continue if a tag for it already exists at a different commit.
      - name: Resolve the draft release to resume
        id: draft
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected vX.Y.Z" >&2; exit 1; }
          read -r draft target < <(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish --jq '"\(.isDraft) \(.targetCommitish)"')
          [[ "$draft" == true ]] || { echo "Retry only an existing draft release" >&2; exit 1; }
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$target" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ steps.draft.outputs.sha }}
      # Release code comes from the draft's commit; release tooling always comes from
      # the workflow's own ref, so a repaired workflow can resume an older draft.
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          path: .release-tooling
          ref: ${{ github.sha }}
          sparse-checkout: |
            tooling
            package.json
            tsconfig.base.json
          sparse-checkout-cone-mode: false
      - name: Verify any existing release tag resolves to the draft target
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ steps.draft.outputs.sha }}
        run: |
          node .release-tooling/tooling/release-state.ts verify-tag \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --expected "$EXPECTED_COMMIT"
      - uses: actions/setup-node@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: 22
      # Reuse what an earlier attempt already shipped: skip the build when every
      # package is public and every asset is attached.
      - id: plan
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name]' > "$RUNNER_TEMP/assets.json"
          node .release-tooling/tooling/release-state.ts plan --tag "$RELEASE_TAG" --assets "$RUNNER_TEMP/assets.json"
      - id: resume
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # release-please cannot edit Cargo.lock, and CI builds with --locked, so keep
      # the lockfile in step with the bumped workspace version on the release PR.
      - name: Check out the release PR branch
        if: steps.rp.outputs.prs_created == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(steps.rp.outputs.prs || '[{}]')[0].headBranchName }}
      - name: Sync Cargo.lock and validate the final release PR SHA
        if: steps.rp.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ fromJSON(steps.rp.outputs.prs || '[{}]')[0].headBranchName }}
        run: |
          cargo update --workspace
          if ! git diff --quiet Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: sync Cargo.lock" Cargo.lock
            git push
          fi
          # GITHUB_TOKEN pushes do not trigger pull_request/push CI. A manual
          # dispatch is explicitly supported and validates the synchronized SHA.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_BRANCH"

  # Same gates as every pull request: fmt, clippy, tests, lint, types, showcase,
  # self-dogfood, and the npm distribution smoke test.
  quality:
    needs: release-please
    if: needs.release-please.outputs.created == 'true' && needs.release-please.outputs.needs_build == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      release-ref: ${{ needs.release-please.outputs.sha }}

  build:
    needs: [release-please, quality]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, archive: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-14, archive: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-14, archive: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag }}
      NAME: entwine-${{ needs.release-please.outputs.tag }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Versions must agree
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="entwine-cli"))')
          node tooling/check-versions.ts "$VERSION"
          [[ "$crate" == "$VERSION" ]] || { echo "tag $VERSION, crate $crate" >&2; exit 1; }
      - name: Build
        run: cargo build --release --locked -p entwine-cli --target ${{ matrix.target }}
      - name: Package archive
        run: |
          exe=entwine; [[ "${{ matrix.target }}" == *windows* ]] && exe=entwine.exe
          mkdir "$NAME"
          cp "target/${{ matrix.target }}/release/$exe" LICENSE README.md "$NAME/"
          if [[ "${{ matrix.archive }}" == zip ]]; then 7z a "$NAME.zip" "$NAME" > /dev/null; else tar -czf "$NAME.tar.gz" "$NAME"; fi
      - name: Smoke-test the binary
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          exe="$NAME/entwine"; [[ "${{ matrix.target }}" == *windows* ]] && exe="$NAME/entwine.exe"
          "$exe" --version
          "$exe" check examples/kitchen-sink
      - name: Stage npm platform package
        run: |
          exe=entwine; [[ "${{ matrix.target }}" == *windows* ]] && exe=entwine.exe
          node tooling/stage-npm.ts platform --target ${{ matrix.target }} --binary "target/${{ matrix.target }}/release/$exe" --version "$VERSION" --out "npm/${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.target }}
          path: ${{ env.NAME }}.${{ matrix.archive }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.target }}
          path: npm/${{ matrix.target }}
          if-no-files-found: error

  github-assets:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: .release-tooling
          ref: ${{ github.sha }}
          sparse-checkout: tooling
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: release-built
          merge-multiple: true
      - name: Preserve and verify existing draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          mkdir release release-existing
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name]' > "$RUNNER_TEMP/existing-assets.json"
          if [[ $(jq 'length' "$RUNNER_TEMP/existing-assets.json") -gt 0 ]]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-existing
          fi
          cp release-built/entwine-* release/
          for asset in release/entwine-*; do
            name=${asset#release/}
            if [[ -f "release-existing/$name" ]]; then
              cp "release-existing/$name" "$asset"
            fi
          done
          if [[ -f release-existing/SHA256SUMS ]]; then
            cp release-existing/SHA256SUMS release/SHA256SUMS
          else
            cd release
            sha256sum entwine-*.tar.gz entwine-*.zip > SHA256SUMS
            cd - > /dev/null
          fi
          (cd release && sha256sum --check SHA256SUMS)
      - name: Attach only missing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          is_draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          [[ "$is_draft" == true ]] || { echo "Refusing to modify non-draft release $RELEASE_TAG" >&2; exit 1; }
          node .release-tooling/tooling/release-state.ts upload-plan \
            --tag "$RELEASE_TAG" \
            --assets "$RUNNER_TEMP/existing-assets.json" \
            --output "$RUNNER_TEMP/upload-assets.txt"
          mapfile -t names < "$RUNNER_TEMP/upload-assets.txt"
          if ((${#names[@]})); then
            files=()
            for name in "${names[@]}"; do files+=("release/$name"); done
            gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY"
          else
            echo "All expected release assets already exist; preserving them."
          fi

  npm:
    needs: [release-please, build]
    # A skipped build is fine only when the plan said nothing needed building; a
    # skipped build because quality failed must never reach the registry.
    if: >-
      ${{ !cancelled() && needs.release-please.outputs.created == 'true' &&
      (needs.build.result == 'success' ||
      (needs.release-please.outputs.needs_build == 'false' && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      BUILT: ${{ needs.release-please.outputs.needs_build }}
    steps:
      - uses: actions/checkout@v4
        if: env.BUILT == 'true'
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: actions/checkout@v4
        with:
          path: .release-tooling
          ref: ${{ github.sha }}
          sparse-checkout: |
            tooling
            package.json
            tsconfig.base.json
          sparse-checkout-cone-mode: false
      - uses: pnpm/action-setup@v4
        if: env.BUILT == 'true'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: ${{ env.BUILT == 'true' && 'pnpm' || '' }}
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
        if: env.BUILT == 'true'
      - run: pnpm --filter @entwine/cli build
        if: env.BUILT == 'true'
      - uses: actions/download-artifact@v4
        if: env.BUILT == 'true'
        with:
          pattern: npm-*
          path: npm-staged
      - name: Stage the launcher package
        if: env.BUILT == 'true'
        run: node tooling/stage-npm.ts main --version "$VERSION" --out npm-staged/main
      # Idempotent: a package whose exact version is already public is skipped.
      - name: Publish platform packages first, launcher last
        if: env.BUILT == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node .release-tooling/tooling/publish-npm.ts npm-staged/npm-* npm-staged/main
      - name: Verify the public registry before exposing the release
        run: node .release-tooling/tooling/smoke-public.ts --version "$VERSION"

  publish-release:
    needs: [release-please, github-assets, npm]
    if: >-
      ${{ !cancelled() && needs.npm.result == 'success' &&
      (needs.github-assets.result == 'success' ||
      (needs.release-please.outputs.needs_build == 'false' && needs.github-assets.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.release-please.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
