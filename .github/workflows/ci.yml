name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-ref:
        required: false
        type: string
        default: ""
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tooling/check-versions.ts
      - run: cargo build --workspace --locked
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Builds the website, `entwine build .`, and the kitchen-sink, composes the
      # exact Cloudflare Pages artifact, and verifies relative links under /docs/ and /demo/.
      - run: pnpm build:showcase
      - run: cargo run -p entwine-cli -- graph examples/kitchen-sink
      - run: cargo run -p entwine-cli -- context examples/kitchen-sink
      - run: cargo run -p entwine-cli -- context examples/kitchen-sink --json
      # `entwine init` and `entwine setup` in fresh repositories for every provider.
      - run: pnpm smoke:setup
      # Stage, pack, install, and run the npm distribution for this platform.
      - run: pnpm smoke:npm
      - uses: actions/upload-artifact@v7
        with:
          name: showcase
          path: deployment
          if-no-files-found: error
          retention-days: 3

  portability:
    strategy:
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cargo test --workspace --locked
      - run: node tooling/smoke-public.ts --version 0.1.0
