name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-ref:
        required: false
        type: string
        default: ""
permissions:
  contents: read
jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tooling/check-versions.ts
      - run: cargo build --workspace --locked
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
      - run: pnpm test:tooling
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Builds the website, `entwine build .`, and the kitchen-sink, composes the
      # exact Cloudflare Pages artifact, and verifies relative links under /docs/ and /demo/.
      - run: pnpm build:showcase
      - run: cargo run -p entwine-cli -- graph examples/kitchen-sink
      - run: cargo run -p entwine-cli -- context examples/kitchen-sink
      - run: cargo run -p entwine-cli -- context examples/kitchen-sink --json
      # `entwine init` and `entwine setup` in fresh repositories for every provider.
      - run: pnpm smoke:setup
      # Stage, pack, install, and run the npm distribution for this platform.
      - run: pnpm smoke:npm
      # Browser E2E against real generated output (Linux Chromium only).
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-traces
          path: test-results
          if-no-files-found: ignore
          retention-days: 3
      # Agentyx-managed agent tooling must match .agentyx.json (no drift, no hand edits).
      - run: pnpm agents:doctor
      - uses: actions/upload-artifact@v7
        with:
          name: showcase
          path: deployment
          if-no-files-found: error
          retention-days: 3

  flowview-experimental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo test --workspace --features flowview-renderer --locked
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo build -p entwine-cli --features flowview-renderer --locked
      - run: cargo build --release -p entwine-cli --features flowview-renderer --locked
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:showcase
        env:
          ENTWINE_RENDERER: flowview
      - run: pnpm test:e2e
        env:
          ENTWINE_RENDERER: flowview

  portability:
    strategy:
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo test --workspace --locked
      - run: pnpm test:tooling
      # Current source, not an old public package: stage, pack, install and run this
      # commit's launcher and binary, and exercise init/setup for every provider.
      - run: pnpm smoke:npm
      - run: pnpm smoke:setup
