name: Deploy showcase to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Format, lint, types, tests, then build and verify the exact showcase
      # artifact: Astro at /, Entwine docs at /docs/, kitchen-sink at /demo/.
      - name: Validate and build showcase
        run: pnpm check
      - uses: actions/upload-artifact@v4
        with:
          name: showcase
          path: deployment
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Nothing is rebuilt here: the validated artifact is deployed as-is.
      - uses: actions/download-artifact@v8
        with:
          name: showcase
          path: deployment
      - name: Require a Pages project name and a complete artifact
        run: |
          [[ "$PAGES_PROJECT" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          test -f deployment/index.html
          test -f deployment/docs/index.html
          test -f deployment/demo/index.html
      - name: Deploy validated artifact
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy deployment --project-name=${{ env.PAGES_PROJECT }} --branch=main
